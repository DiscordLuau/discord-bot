name = "discord_luau/discord_bot"
version = "0.1.0"
license = "MIT"
pesde_version = "0.7.3"

[target]
environment = "luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
discord = { name = "discord_luau/discord_luau", version = "0.0.4" }
builders = { name = "discord_luau/builders", version = "0.0.4" }
logger = { name = "discord_luau/logger", version = "0.0.4" }
classes = { name = "discord_luau/classes", version = "0.0.6" }
commands = { name = "discord_luau/commands", version = "0.0.3" }

[patches]
"yetanotherclown/luau_futures" = { "2.0.0-beta.3 luau" = "patches/yetanotherclown+luau_futures-2.0.0-beta.3+luau.patch" }
